<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex03 - Color Models & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Color Models Palette</h1>
    <div class="swatch-container">
        <div class="swatch named">Named (tomato)</div>
        <div class="swatch hex">HEX (#3498db)</div>
        <div class="swatch rgb">RGB (Green)</div>
        <div class="swatch rgba">RGBA (Purple 0.7)</div>
    </div>

    <h2>Opacity vs RGBA Comparison</h2>
    <div class="comparison-container">
        <div class="box opacity-box">
            <p>Using opacity: 0.5 (Fades text and box together)</p>
        </div>
        <div class="box rgba-box">
            <p>Using rgba() (Fades background only, text stays sharp)</p>
        </div>
    </div>

</body>
</html>
