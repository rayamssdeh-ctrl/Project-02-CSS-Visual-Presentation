<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex02 - CSS Shapes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Pure CSS Shapes</h1>

    <div class="shapes-container">
        <!-- 1. Square -->
        <div class="shape square" title="Square"></div>

        <!-- 2. Rectangle -->
        <div class="shape rectangle" title="Rectangle"></div>

        <!-- 3. Circle -->
        <div class="shape circle" title="Circle"></div>

        <!-- 4. Capsule Pill -->
        <div class="shape capsule" title="Capsule"></div>

        <!-- 5. Triangle -->
        <div class="shape triangle" title="Triangle"></div>
    </div>

</body>
</html>
