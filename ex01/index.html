<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex01 - CSS Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Fixed Navigation Bar -->
    <header class="fixed-nav">
        <span>Positioning Master</span>
        <a href="#">Menu</a>
    </header>

    <div class="content-spacer"></div>

    <main class="main-container">
        <!-- 2. Relative Container with Absolute Badge -->
        <div class="card-box">
            <span class="badge">NEW</span>
            <h2>Absolute Anchored Card</h2>
            <p>This card uses relative positioning, acting as an anchor for the absolute badge in its corner.</p>
        </div>
    </main>

    <!-- 4. Fixed Back-to-Top Button -->
    <a href="#" class="top-btn">Top</a>

</body>
</html>
